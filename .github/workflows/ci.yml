name: CI

on:
  push:
    branches:
      - master
      - 'revive/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The gate: the tree a user gets from `npm install -g apix-hedera`, resolved
      # fresh, without peer-only packages (scripts/audit-prod.mjs)
      - run: npm run audit:prod
      # Informational: this repository's own tree. braces also reaches it
      # through dev tools (jest, nodemon), so this step is expected to fail
      - name: npm audit of the repository tree (informational)
        run: npm audit --omit=dev
        continue-on-error: true
      - run: npm run build:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (CLI prints package version)
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/cli/index.js --version)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

  # Does `apix add` produce code that installs, type-checks and builds in a
  # fresh create-next-app project? (scripts/e2e-generate.ts)
  e2e-generate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e:generate -- --framework next --case baseline,all --out "$RUNNER_TEMP/apix-e2e"
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-generate-logs
          path: |
            ${{ runner.temp }}/apix-e2e/logs
            ${{ runner.temp }}/apix-e2e/results.json
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
