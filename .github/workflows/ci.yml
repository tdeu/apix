name: CI

on:
  push:
    branches:
      - master
      - 'revive/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (CLI prints package version)
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/cli/index.js --version)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
