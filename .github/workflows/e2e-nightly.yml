name: E2E generation (nightly)

# Every case of scripts/e2e-generate.ts on every framework: each integration on
# its own fresh project, all of them together, and the refusals (account,
# Pages Router routes, server integrations on Vite) with the project unchanged.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e:generate -- --framework all --out "$RUNNER_TEMP/apix-e2e"
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-generate-nightly-logs
          path: |
            ${{ runner.temp }}/apix-e2e/logs
            ${{ runner.temp }}/apix-e2e/results.json
          if-no-files-found: ignore
